<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <!-- Fondo oscuro base profundo (el color que tenía antes: slate-950 con matices esmeralda) -->
    <linearGradient id="dark-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#051512"/>
      <stop offset="70%" stop-color="#020b09"/>
      <stop offset="100%" stop-color="#030811"/>
    </linearGradient>

    <!-- Filtro de turbulencia para vetas de mármol orgánicas -->
    <filter id="dark-marble-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="5" result="noise" seed="68"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="42" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Gradiente Vetas Verdes Esmeralda -->
    <linearGradient id="green-vein-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#34d399" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.20"/>
    </linearGradient>

    <linearGradient id="green-vein-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Gradiente Vetas Blancas / Cristalinas -->
    <linearGradient id="white-vein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Resplandor tenue para las vetas -->
    <filter id="vein-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Capa 1: Fondo Oscuro -->
  <rect width="100%" height="100%" fill="url(#dark-base)"/>

  <!-- Nubes de profundidad esmeralda mineral tenue -->
  <path d="M-100,180 Q320,80 650,320 T1450,260 L1450,-100 L-100,-100 Z" fill="#062820" opacity="0.35"/>
  <path d="M-100,680 Q450,540 850,780 T1450,620 L1450,1100 L-100,1100 Z" fill="#042019" opacity="0.40"/>

  <!-- Capa 2: Vetas Orgánicas Verdes y Blancas -->
  <g filter="url(#dark-marble-filter)">
    <!-- 1. Veta Principal Verde Esmeralda (Diagonal Superior) -->
    <path d="M-100,160 Q280,110 580,280 T1080,250 T1500,140" fill="none" stroke="url(#green-vein-1)" stroke-width="16" stroke-linecap="round"/>
    <path d="M-100,160 Q280,110 580,280 T1080,250 T1500,140" fill="none" stroke="#10b981" stroke-width="4.5" stroke-opacity="0.75" stroke-linecap="round"/>
    
    <!-- Veta Blanca fina entrelazada en el centro de la veta verde -->
    <path d="M-100,160 Q280,110 580,280 T1080,250 T1500,140" fill="none" stroke="url(#white-vein)" stroke-width="2" stroke-linecap="round"/>

    <!-- 2. Veta Principal Blanca Cristalina Cruzada -->
    <path d="M-80,620 Q280,450 680,590 T1220,510 T1480,720" fill="none" stroke="url(#white-vein)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-80,620 Q280,450 680,590 T1220,510 T1480,720" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round"/>
    
    <!-- Borde verde luminoso alrededor de la veta blanca -->
    <path d="M-80,620 Q280,450 680,590 T1220,510 T1480,720" fill="none" stroke="#059669" stroke-width="15" stroke-opacity="0.25" stroke-linecap="round"/>

    <!-- 3. Ramificación Verde Diagonal Descendente -->
    <path d="M160,-50 Q450,280 620,580 T980,1050" fill="none" stroke="url(#green-vein-2)" stroke-width="11" stroke-linecap="round"/>
    <path d="M160,-50 Q450,280 620,580 T980,1050" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-opacity="0.70" stroke-linecap="round"/>
    <path d="M160,-50 Q450,280 620,580 T980,1050" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75" stroke-linecap="round"/>

    <!-- 4. Vetas Secundarias y Capilares Verdes y Blancos -->
    <path d="M320,200 Q540,420 820,380 T1250,560" fill="none" stroke="url(#green-vein-1)" stroke-width="7" stroke-linecap="round"/>
    <path d="M420,280 Q620,160 820,250" fill="none" stroke="url(#white-vein)" stroke-width="3" stroke-linecap="round"/>
    <path d="M550,540 Q760,700 1080,660 T1450,910" fill="none" stroke="url(#green-vein-2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M550,540 Q760,700 1080,660 T1450,910" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.80" stroke-linecap="round"/>

    <!-- 5. Filamentos finos minerales blancos y esmeralda -->
    <path d="M780,90 Q940,310 1080,260" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.60"/>
    <path d="M80,780 Q320,890 520,820 T950,920" fill="none" stroke="#34d399" stroke-width="4.5" stroke-opacity="0.50"/>
    <path d="M80,780 Q320,890 520,820 T950,920" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.70"/>
    <path d="M620,740 Q760,910 890,950" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.45"/>
  </g>
</svg>
