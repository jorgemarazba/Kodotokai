<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <!-- Fondo blanco perla suave -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fcfcfd"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Filtro de turbulencia para vetas naturales orgánicas -->
    <filter id="marble-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="5" result="noise" seed="42"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <linearGradient id="vein1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="vein2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="gold-vein" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Capa 1: Base -->
  <rect width="100%" height="100%" fill="url(#base)"/>

  <!-- Sombras minerales tenues de fondo -->
  <path d="M-100,200 Q300,100 600,350 T1300,300 L1300,-100 L-100,-100 Z" fill="#f1f5f9" opacity="0.6"/>
  <path d="M-100,650 Q400,500 800,750 T1300,600 L1300,1000 L-100,1000 Z" fill="#e2e8f0" opacity="0.4"/>

  <!-- Capa 2: Vetas minerales principales con filtro orgánico -->
  <g filter="url(#marble-filter)">
    <!-- Veta principal diagonal superior -->
    <path d="M-80,180 Q220,120 480,260 T920,240 T1300,150" fill="none" stroke="url(#vein1)" stroke-width="12" stroke-linecap="round"/>
    <path d="M-80,180 Q220,120 480,260 T920,240 T1300,150" fill="none" stroke="#475569" stroke-width="2.5" stroke-opacity="0.35" stroke-linecap="round"/>
    
    <!-- Ramificación secundaria -->
    <path d="M260,180 Q450,380 720,340 T1100,520" fill="none" stroke="url(#vein2)" stroke-width="7" stroke-linecap="round"/>
    <path d="M380,240 Q520,140 680,220" fill="none" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Veta transversal diagonal central -->
    <path d="M-50,580 Q240,420 580,560 T1050,480 T1280,680" fill="none" stroke="url(#vein2)" stroke-width="14" stroke-linecap="round"/>
    <path d="M-50,580 Q240,420 580,560 T1050,480 T1280,680" fill="none" stroke="#64748b" stroke-width="3" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- Veta con destello sutil dorado/cálido (Calacatta Gold) -->
    <path d="M120,-40 Q380,260 520,540 T850,940" fill="none" stroke="url(#gold-vein)" stroke-width="9" stroke-linecap="round"/>
    <path d="M480,480 Q680,620 960,580 T1280,820" fill="none" stroke="#94a3b8" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round"/>

    <!-- Micro-vetas finas -->
    <path d="M680,80 Q820,280 940,240" fill="none" stroke="#64748b" stroke-width="1.8" stroke-opacity="0.25"/>
    <path d="M80,720 Q280,820 460,760 T820,860" fill="none" stroke="#94a3b8" stroke-width="4" stroke-opacity="0.3"/>
    <path d="M520,680 Q640,840 760,880" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.2"/>
  </g>
</svg>
